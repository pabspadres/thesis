<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ethical Compliance Index Prototype</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    @font-face {
      font-family: "InterCustom";
      src: url("./Fonts/Inter/static/Inter_24pt-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }

    @font-face {
      font-family: "MontserratCustom";
      src: url("./Fonts/Montserrat/static/Montserrat-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }

    :root {
      color: #000;
      background: #fff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      color: #000;
      overflow: hidden;
    }

    body {
      position: relative;
      font-family: "MontserratCustom", sans-serif;
    }

    #app-interface {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
    }

    #intro-view {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      color: #000;
      display: block;
    }

    #intro-header {
      position: absolute;
      top: 20px;
      left: 40px;
      right: 10px;
      height: 120px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    #intro-title {
      margin: 0;
      color: #000;
      font-family: "InterCustom", sans-serif;
      font-weight: 700;
      font-size: 56px;
      line-height: 0.95;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    #intro-copy {
      margin: 0;
      color: #000;
      font-family: "MontserratCustom", sans-serif;
      font-weight: 400;
      font-size: 20px;
      line-height: 1.18;
      flex: 1 1 auto;
      max-width: 760px;
      text-align: left;
      align-self: center;
    }

    #intro-content {
      position: absolute;
      top: 150px;
      left: 0;
      right: 0;
      bottom: 48px;
      width: 100%;
      height: calc(100% - 198px);
      display: flex;
    }

    #intro-left {
      width: 30%;
      min-width: 220px;
      height: 100%;
      position: relative;
      padding: 18px 16px 16px 40px;
    }

    #intro-chart-panel {
      width: 70%;
      height: 100%;
      position: relative;
      padding: 10px 18px 18px 8px;
    }

    #intro-chart {
      width: 100%;
      height: 100%;
      display: block;
      background: #fff;
    }

    #intro-token-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 15;
    }

    .intro-token {
      position: absolute;
      width: 124px;
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      cursor: grab;
      transition: left 1.1s ease, top 1.1s ease;
      user-select: none;
      touch-action: none;
    }

    .intro-token img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    .intro-token.is-dragging {
      transition: none;
      cursor: grabbing;
      z-index: 40;
    }

    #intro-skip {
      position: absolute;
      right: 12px;
      bottom: 10px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #000;
      text-decoration: underline;
      font-family: "MontserratCustom", sans-serif;
      font-size: 18px;
      font-weight: 400;
      cursor: pointer;
    }

    #title {
      position: absolute;
      top: 20px;
      left: 40px;
      margin: 0;
      color: #000;
      font-family: "InterCustom", sans-serif;
      font-weight: 1200;
      font-size: 52px;
      line-height: 1;
      white-space: nowrap;
      z-index: 20;
    }

    #view-toggle {
      position: absolute;
      top: 20px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 20;
    }

    .view-button {
      min-width: 94px;
      height: 38px;
      border: 2px solid #000;
      background: #fff;
      color: #000;
      cursor: pointer;
      font-family: "MontserratCustom", sans-serif;
      font-size: 16px;
      font-weight: 400;
      line-height: 1;
    }

    .view-button.active {
      background: #000;
      color: #fff;
    }

    #dots-view,
    #bars-view {
      position: absolute;
      top: 66px;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: calc(100% - 66px);
      font-family: "MontserratCustom", sans-serif;
      color: #000;
    }

    #bars-view {
      display: none;
    }

    #main {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      width: 100%;
      height: 100%;
    }

    #legend-panel {
      width: 30%;
      min-width: 220px;
      height: 100%;
      overflow-y: auto;
      padding: 18px 16px 16px 40px;
      font-size: 20px;
      scrollbar-width: none;
    }

    #legend-panel::-webkit-scrollbar {
      display: none;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 8px 0;
      line-height: 1.2;
      color: #000;
      font-family: "MontserratCustom", sans-serif;
      font-weight: 400;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    #chart-panel {
      width: 70%;
      height: 100%;
      padding: 10px 18px 18px 8px;
    }

    #chart {
      width: 100%;
      height: 100%;
      display: block;
      background: #fff;
    }

    .scatter-dot {
      transition: transform 0.2s ease;
      transform-origin: center;
      transform-box: fill-box;
    }

    .scatter-dot.is-hovered {
      transform: scale(1.2);
    }

    #bars-layout {
      width: 100%;
      height: 100%;
      padding: 10px;
    }

    #bars-scroll {
      width: 100%;
      height: calc(100% - 74px);
      overflow-y: auto;
      overflow-x: hidden;
    }

    #bars-chart {
      width: 100%;
      display: block;
      background: #fff;
    }

    #bars-axis-wrap {
      width: 100%;
      height: 74px;
      background: #fff;
      overflow: hidden;
    }

    #bars-axis {
      width: 100%;
      height: 100%;
      display: block;
      background: #fff;
    }

  </style>
</head>
<body>
  <section id="intro-view" aria-label="Intro Interactive Game">
    <div id="intro-header">
      <h1 id="intro-title">HOW WELL DO YOU<br>KNOW THESE BRANDS?</h1>
      <p id="intro-copy">Based on how ethical they are the revenue they makes yearly, place the following brands on this graph to find out how well you know the industry.</p>
    </div>

    <div id="intro-content">
      <div id="intro-left" aria-label="Draggable brand logos"></div>
      <div id="intro-chart-panel">
        <svg id="intro-chart" role="img" aria-label="Scatter plot axes for ethical compliance score and revenue scale score"></svg>
      </div>
      <div id="intro-token-layer" aria-hidden="false"></div>
    </div>

    <button id="intro-skip" type="button">Skip</button>
  </section>

  <div id="app-interface">
    <h1 id="title">ETHICAL COMPLIANCE INDEX</h1>

    <div id="view-toggle">
      <button id="dots-btn" class="view-button active" type="button">Dots</button>
      <button id="bars-btn" class="view-button" type="button">Bars</button>
    </div>

    <section id="dots-view" aria-label="Dots View">
      <div id="main">
        <div id="legend-panel" aria-label="Legend"></div>
        <div id="chart-panel">
          <svg id="chart" role="img" aria-label="Scatter plot of Ethical Compliance Score vs Revenue Scale Score"></svg>
        </div>
      </div>
    </section>

    <section id="bars-view" aria-label="Bars View">
      <div id="bars-layout">
        <div id="bars-scroll">
          <svg id="bars-chart" role="img" aria-label="Scrollable horizontal bars by brand"></svg>
        </div>
        <div id="bars-axis-wrap">
          <svg id="bars-axis" role="img" aria-label="Combined Score x-axis"></svg>
        </div>
      </div>
    </section>
  </div>

  <script>
    const controlFile = "./Data/Control_Database.xlsx";
    const colorFile = "./Data/Color_Database.xlsx";
    const scatterTicks = [0, 25, 50, 75, 100];
    const barsTicks = [0, 50, 100, 150, 200];
    const introTokenDefs = [
      { id: "lululemon", file: "./media/lululemon.png", brands: ["lululemon"] },
      { id: "levi", file: "./media/levi.png", brands: ["levi strauss & co.", "levi strauss and co", "levi"] },
      { id: "rl", file: "./media/RL.png", brands: ["ralph lauren"] },
      { id: "gap", file: "./media/gap.png", brands: ["gap"] },
      { id: "nike", file: "./media/nike.png", brands: ["nike"] },
      { id: "patagonia", file: "./media/patagonia.png", brands: ["patagonia"] }
    ];

    function normalizeBrand(value) {
      return String(value || "").trim().toLowerCase();
    }

    function readWorkbookFromBuffer(buffer) {
      return XLSX.read(buffer, { type: "array" });
    }

    function getFirstSheetRows(workbook) {
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      return XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: null, raw: true });
    }

    function findHeaderRow(rows, requiredHeaders) {
      const required = requiredHeaders.map((h) => h.toLowerCase());
      return rows.findIndex((row) => {
        const rowHeaders = row
          .map((cell) => (typeof cell === "string" ? cell.trim().toLowerCase() : ""))
          .filter(Boolean);
        return required.every((requiredHeader) => rowHeaders.includes(requiredHeader));
      });
    }

    function parseControlRows(rows) {
      const headerRowIndex = findHeaderRow(rows, ["Brand", "Ethical Compliance Score", "Scale Score (Revenue)", "Final Score"]);
      if (headerRowIndex === -1) {
        throw new Error("Control_Database.xlsx header row not found.");
      }

      const headers = rows[headerRowIndex].map((v) => (typeof v === "string" ? v.trim() : v));
      const brandIdx = headers.findIndex((h) => String(h).toLowerCase() === "brand");
      const ethicalIdx = headers.findIndex((h) => String(h).toLowerCase() === "ethical compliance score");
      const scaleIdx = headers.findIndex((h) => String(h).toLowerCase() === "scale score (revenue)");
      const finalIdx = headers.findIndex((h) => String(h).toLowerCase() === "final score");

      const output = [];
      for (let i = headerRowIndex + 1; i < rows.length; i += 1) {
        const row = rows[i];
        if (!row || row.length === 0) {
          continue;
        }

        const brand = row[brandIdx];
        const ethicalScore = Number(row[ethicalIdx]);
        const scaleScore = Number(row[scaleIdx]);
        const finalScore = Number(row[finalIdx]);

        if (!brand || Number.isNaN(ethicalScore) || Number.isNaN(scaleScore) || Number.isNaN(finalScore)) {
          continue;
        }

        output.push({
          brand: String(brand).trim(),
          ethical: Math.max(0, Math.min(100, ethicalScore)),
          scale: Math.max(0, Math.min(100, scaleScore)),
          final: Math.max(0, Math.min(200, finalScore))
        });
      }
      return output;
    }

    function parseColorRows(rows) {
      const headerRowIndex = findHeaderRow(rows, ["Brand", "Color"]);
      if (headerRowIndex === -1) {
        throw new Error("Color_Database.xlsx header row not found.");
      }

      const headers = rows[headerRowIndex].map((v) => (typeof v === "string" ? v.trim() : v));
      const brandIdx = headers.findIndex((h) => String(h).toLowerCase() === "brand");
      const colorIdx = headers.findIndex((h) => String(h).toLowerCase() === "color");

      const colorMap = new Map();
      for (let i = headerRowIndex + 1; i < rows.length; i += 1) {
        const row = rows[i];
        if (!row || row.length === 0) {
          continue;
        }

        const brand = row[brandIdx];
        const color = row[colorIdx];

        if (!brand || !color) {
          continue;
        }

        colorMap.set(normalizeBrand(brand), String(color).trim());
      }
      return colorMap;
    }

    function svgText(content, x, y, extraAttrs = "") {
      return `<text x="${x}" y="${y}" ${extraAttrs}>${content}</text>`;
    }

    function escapeXml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&apos;");
    }

    function getScatterLayout(svgElement) {
      const width = Math.max(640, svgElement.clientWidth);
      const height = Math.max(420, svgElement.clientHeight);
      const margin = { top: 24, right: 30, bottom: 72, left: 86 };
      const chartW = width - margin.left - margin.right;
      const chartH = height - margin.top - margin.bottom;
      const xToPx = (value) => margin.left + (value / 100) * chartW;
      const yToPx = (value) => margin.top + chartH - (value / 100) * chartH;

      return {
        width,
        height,
        margin,
        chartW,
        chartH,
        xToPx,
        yToPx
      };
    }

    function buildScatterAxisAndTicks(layout) {
      const { margin, chartW, chartH, height, xToPx, yToPx } = layout;
      const axisAndTicks = [];

      axisAndTicks.push(`<line x1="${margin.left}" y1="${margin.top + chartH}" x2="${margin.left + chartW}" y2="${margin.top + chartH}" stroke="#000" stroke-width="1.5" />`);
      axisAndTicks.push(`<line x1="${margin.left}" y1="${margin.top + chartH}" x2="${margin.left}" y2="${margin.top}" stroke="#000" stroke-width="1.5" />`);

      scatterTicks.forEach((tick) => {
        const x = xToPx(tick);
        const y = yToPx(tick);

        axisAndTicks.push(`<line x1="${x}" y1="${margin.top + chartH}" x2="${x}" y2="${margin.top + chartH + 6}" stroke="#000" stroke-width="1" />`);
        axisAndTicks.push(svgText(tick, x, margin.top + chartH + 24, 'text-anchor="middle" font-family="MontserratCustom" font-size="13" fill="#000" font-weight="400"'));

        axisAndTicks.push(`<line x1="${margin.left - 6}" y1="${y}" x2="${margin.left}" y2="${y}" stroke="#000" stroke-width="1" />`);
        axisAndTicks.push(svgText(tick, margin.left - 12, y + 4, 'text-anchor="end" font-family="MontserratCustom" font-size="13" fill="#000" font-weight="400"'));
      });

      axisAndTicks.push(svgText("Ethical Compliance Score", margin.left + chartW / 2, height - 22, 'text-anchor="middle" font-family="MontserratCustom" font-size="15" fill="#000" font-weight="400"'));
      axisAndTicks.push(`<text x="24" y="${margin.top + chartH / 2}" transform="rotate(-90 24 ${margin.top + chartH / 2})" text-anchor="middle" font-family="MontserratCustom" font-size="15" fill="#000" font-weight="400">Revenue Scale Score</text>`);

      return axisAndTicks;
    }

    function renderLegend(points) {
      const legendPanel = document.getElementById("legend-panel");
      legendPanel.innerHTML = "";

      points.forEach((point) => {
        const item = document.createElement("div");
        item.className = "legend-item";

        const dot = document.createElement("span");
        dot.className = "legend-dot";
        dot.style.backgroundColor = point.color;

        const label = document.createElement("span");
        label.textContent = point.brand;

        item.appendChild(dot);
        item.appendChild(label);
        legendPanel.appendChild(item);
      });
    }

    function renderScatter(points) {
      const svg = document.getElementById("chart");
      const layout = getScatterLayout(svg);
      const { width, height, xToPx, yToPx } = layout;
      const axisAndTicks = buildScatterAxisAndTicks(layout);

      const dots = points
        .map((point) => {
          const cx = xToPx(point.ethical);
          const cy = yToPx(point.scale);
          return `<circle class="scatter-dot" data-brand="${escapeXml(point.brand)}" cx="${cx}" cy="${cy}" r="8" fill="${point.color}" />`;
        })
        .join("");

      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.innerHTML = `<g>${axisAndTicks.join("")}${dots}</g>
      <g id="tooltip" visibility="hidden" pointer-events="none">
        <rect id="tooltip-bg" x="0" y="0" width="0" height="0" rx="4" ry="4" fill="rgba(0,0,0,0.6)"></rect>
        <text id="tooltip-text" x="0" y="0" fill="#fff" font-family="MontserratCustom" font-size="13" font-weight="400"></text>
      </g>`;

      const tooltipGroup = svg.querySelector("#tooltip");
      const tooltipBg = svg.querySelector("#tooltip-bg");
      const tooltipText = svg.querySelector("#tooltip-text");
      const dotElements = svg.querySelectorAll(".scatter-dot");

      dotElements.forEach((dot) => {
        dot.addEventListener("mouseenter", (event) => {
          dot.classList.add("is-hovered");
          const brand = dot.getAttribute("data-brand") || "";
          tooltipText.textContent = brand;

          const textBox = tooltipText.getBBox();
          const paddingX = 8;
          const paddingY = 6;
          const boxWidth = textBox.width + paddingX * 2;
          const boxHeight = textBox.height + paddingY * 2;

          const cx = Number(dot.getAttribute("cx"));
          const cy = Number(dot.getAttribute("cy"));
          let boxX = cx + 12;
          let boxY = cy - boxHeight - 12;

          if (boxX + boxWidth > width - 4) {
            boxX = cx - boxWidth - 12;
          }
          if (boxY < 4) {
            boxY = cy + 12;
          }

          tooltipBg.setAttribute("x", String(boxX));
          tooltipBg.setAttribute("y", String(boxY));
          tooltipBg.setAttribute("width", String(boxWidth));
          tooltipBg.setAttribute("height", String(boxHeight));

          tooltipText.setAttribute("x", String(boxX + paddingX));
          tooltipText.setAttribute("y", String(boxY + boxHeight - paddingY - 1));

          tooltipGroup.setAttribute("visibility", "visible");
        });

        dot.addEventListener("mouseleave", () => {
          dot.classList.remove("is-hovered");
          tooltipGroup.setAttribute("visibility", "hidden");
        });
      });
    }

    function renderIntroChart() {
      const svg = document.getElementById("intro-chart");
      const layout = getScatterLayout(svg);
      const axisAndTicks = buildScatterAxisAndTicks(layout);
      svg.setAttribute("viewBox", `0 0 ${layout.width} ${layout.height}`);
      svg.innerHTML = `<g>${axisAndTicks.join("")}</g>`;
    }

    const introState = {
      tokenMap: new Map(),
      dragId: null,
      dragOffsetX: 0,
      dragOffsetY: 0,
      revealTimer: null,
      revealed: false
    };

    function getIntroTokenById(tokenId) {
      return introState.tokenMap.get(tokenId);
    }

    function setTokenPosition(tokenState, x, y) {
      tokenState.x = x;
      tokenState.y = y;
      tokenState.el.style.left = `${x}px`;
      tokenState.el.style.top = `${y}px`;
    }

    function getIntroBrandPoint(tokenDef) {
      for (let i = 0; i < tokenDef.brands.length; i += 1) {
        const targetBrand = normalizeBrand(tokenDef.brands[i]);
        const exact = currentPoints.find((point) => normalizeBrand(point.brand) === targetBrand);
        if (exact) {
          return exact;
        }
      }

      for (let i = 0; i < tokenDef.brands.length; i += 1) {
        const targetBrand = normalizeBrand(tokenDef.brands[i]);
        const partial = currentPoints.find((point) => normalizeBrand(point.brand).includes(targetBrand));
        if (partial) {
          return partial;
        }
      }

      return null;
    }

    function placeIntroTokensInTray() {
      const content = document.getElementById("intro-content");
      const leftPanel = document.getElementById("intro-left");
      const contentRect = content.getBoundingClientRect();
      const leftRect = leftPanel.getBoundingClientRect();

      const horizontalPadding = 20;
      const verticalPadding = 16;
      const colGap = 20;
      const rowGap = 16;
      const tokenAspect = 124 / 74;

      const trayWidth = leftRect.width;
      const trayHeight = leftRect.height;

      const widthDrivenTokenWidth = (trayWidth - horizontalPadding * 2 - colGap) / 2;
      let tokenWidth = Math.max(60, widthDrivenTokenWidth);
      let tokenHeight = tokenWidth / tokenAspect;

      const maxTokenHeightToFitVertically = (trayHeight - verticalPadding * 2 - rowGap * 2) / 3;
      if (tokenHeight > maxTokenHeightToFitVertically) {
        tokenHeight = Math.max(40, maxTokenHeightToFitVertically);
        tokenWidth = tokenHeight * tokenAspect;
      }

      const startX = leftRect.left - contentRect.left + horizontalPadding;
      const startY = leftRect.top - contentRect.top + verticalPadding;

      introTokenDefs.forEach((tokenDef, index) => {
        const tokenState = getIntroTokenById(tokenDef.id);
        if (!tokenState || tokenState.placed) {
          return;
        }

        tokenState.el.style.width = `${tokenWidth}px`;
        tokenState.el.style.height = `${tokenHeight}px`;

        const col = index % 2;
        const row = Math.floor(index / 2);
        const x = startX + col * (tokenWidth + colGap);
        const y = startY + row * (tokenHeight + rowGap);
        setTokenPosition(tokenState, x, y);
      });
    }

    function maybeStartRevealTimer() {
      if (introState.revealed || introState.revealTimer) {
        return;
      }

      const allPlaced = introTokenDefs.every((tokenDef) => {
        const tokenState = getIntroTokenById(tokenDef.id);
        return tokenState && tokenState.placed;
      });

      if (!allPlaced) {
        return;
      }

      introState.revealTimer = window.setTimeout(() => {
        introState.revealTimer = null;
        revealIntroCorrectPlacements();
      }, 1000);
    }

    function updateSkipLabelAfterReveal() {
      const skipButton = document.getElementById("intro-skip");
      skipButton.textContent = "Explore More";
    }

    function revealIntroCorrectPlacements(force = false) {
      if (introState.revealed && !force) {
        return;
      }

      const content = document.getElementById("intro-content");
      const chart = document.getElementById("intro-chart");
      const contentRect = content.getBoundingClientRect();
      const chartRect = chart.getBoundingClientRect();
      const layout = getScatterLayout(chart);

      introTokenDefs.forEach((tokenDef) => {
        const tokenState = getIntroTokenById(tokenDef.id);
        const point = getIntroBrandPoint(tokenDef);
        if (!tokenState || !point) {
          return;
        }

        const targetX = chartRect.left - contentRect.left + layout.xToPx(point.ethical) - tokenState.el.offsetWidth / 2;
        const targetY = chartRect.top - contentRect.top + layout.yToPx(point.scale) - tokenState.el.offsetHeight / 2;
        tokenState.placed = true;
        setTokenPosition(tokenState, targetX, targetY);
      });

      if (!introState.revealed) {
        introState.revealed = true;
        updateSkipLabelAfterReveal();
      }
    }

    function introOnPointerMove(event) {
      if (!introState.dragId) {
        return;
      }

      const content = document.getElementById("intro-content");
      const contentRect = content.getBoundingClientRect();
      const tokenState = getIntroTokenById(introState.dragId);
      if (!tokenState) {
        return;
      }

      const x = event.clientX - contentRect.left - introState.dragOffsetX;
      const y = event.clientY - contentRect.top - introState.dragOffsetY;
      setTokenPosition(tokenState, x, y);
    }

    function introOnPointerUp() {
      if (!introState.dragId) {
        return;
      }

      const tokenState = getIntroTokenById(introState.dragId);
      const content = document.getElementById("intro-content");
      const chart = document.getElementById("intro-chart");
      const contentRect = content.getBoundingClientRect();
      const chartRect = chart.getBoundingClientRect();

      if (tokenState) {
        tokenState.el.classList.remove("is-dragging");
        tokenState.el.style.zIndex = "20";
        const centerX = contentRect.left + tokenState.x + tokenState.el.offsetWidth / 2;
        const centerY = contentRect.top + tokenState.y + tokenState.el.offsetHeight / 2;
        tokenState.placed = (
          centerX >= chartRect.left
          && centerX <= chartRect.right
          && centerY >= chartRect.top
          && centerY <= chartRect.bottom
        );
      }

      introState.dragId = null;

      if (introState.revealTimer) {
        const allPlaced = introTokenDefs.every((tokenDef) => {
          const state = getIntroTokenById(tokenDef.id);
          return state && state.placed;
        });
        if (!allPlaced) {
          window.clearTimeout(introState.revealTimer);
          introState.revealTimer = null;
        }
      }

      maybeStartRevealTimer();
    }

    function startIntroDrag(event, tokenDef) {
      const tokenState = getIntroTokenById(tokenDef.id);
      if (!tokenState || introState.revealed) {
        return;
      }

      const tokenRect = tokenState.el.getBoundingClientRect();
      introState.dragId = tokenDef.id;
      introState.dragOffsetX = event.clientX - tokenRect.left;
      introState.dragOffsetY = event.clientY - tokenRect.top;
      tokenState.el.classList.add("is-dragging");
      tokenState.el.style.zIndex = "50";
    }

    function createIntroTokens() {
      const tokenLayer = document.getElementById("intro-token-layer");
      tokenLayer.innerHTML = "";
      introState.tokenMap.clear();

      introTokenDefs.forEach((tokenDef) => {
        const token = document.createElement("div");
        token.className = "intro-token";
        token.dataset.tokenId = tokenDef.id;

        const image = document.createElement("img");
        image.src = tokenDef.file;
        image.alt = tokenDef.id;
        token.appendChild(image);

        token.addEventListener("pointerdown", (event) => {
          startIntroDrag(event, tokenDef);
        });

        tokenLayer.appendChild(token);
        introState.tokenMap.set(tokenDef.id, {
          id: tokenDef.id,
          el: token,
          x: 0,
          y: 0,
          placed: false
        });
      });

      document.addEventListener("pointermove", introOnPointerMove);
      document.addEventListener("pointerup", introOnPointerUp);
      placeIntroTokensInTray();
    }

    function showMainInterface() {
      const introView = document.getElementById("intro-view");
      const appInterface = document.getElementById("app-interface");

      if (introState.revealTimer) {
        window.clearTimeout(introState.revealTimer);
        introState.revealTimer = null;
      }

      introView.style.display = "none";
      appInterface.style.display = "block";

      switchView("dots");
    }

    function renderBars(points) {
      const svg = document.getElementById("bars-chart");
      const axisSvg = document.getElementById("bars-axis");
      const scroll = document.getElementById("bars-scroll");
      const width = Math.max(900, scroll.clientWidth);

      const barHeight = 22;
      const rowGap = 12;
      const totalRowsHeight = points.length * (barHeight + rowGap);
      const margin = { top: 16, right: 36, bottom: 12, left: 190 };
      const height = margin.top + totalRowsHeight + margin.bottom;
      const chartW = width - margin.left - margin.right;

      const xToPx = (value) => margin.left + (value / 200) * chartW;

      const elements = [];
      elements.push(`<line x1="${margin.left}" y1="${margin.top}" x2="${margin.left}" y2="${height - margin.bottom}" stroke="#000" stroke-width="1.5" />`);

      points.forEach((point, index) => {
        const y = margin.top + index * (barHeight + rowGap);
        const barEnd = xToPx(point.final);
        elements.push(`<rect x="${margin.left}" y="${y}" width="${Math.max(0, barEnd - margin.left)}" height="${barHeight}" fill="${point.color}" />`);
        elements.push(svgText(escapeXml(point.brand), margin.left - 10, y + barHeight - 6, 'text-anchor="end" font-family="MontserratCustom" font-size="13" fill="#000" font-weight="400"'));
      });

      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("height", String(height));
      svg.innerHTML = `<g>${elements.join("")}</g>`;

      const axisHeight = 74;
      const axisY = 16;
      const axisElements = [];
      axisElements.push(`<line x1="${margin.left}" y1="${axisY}" x2="${margin.left + chartW}" y2="${axisY}" stroke="#000" stroke-width="1.5" />`);
      axisElements.push(`<line x1="${margin.left}" y1="4" x2="${margin.left}" y2="${axisY}" stroke="#000" stroke-width="1.5" />`);

      barsTicks.forEach((tick) => {
        const x = xToPx(tick);
        axisElements.push(`<line x1="${x}" y1="${axisY}" x2="${x}" y2="${axisY + 6}" stroke="#000" stroke-width="1" />`);
        axisElements.push(svgText(tick, x, axisY + 24, 'text-anchor="middle" font-family="MontserratCustom" font-size="13" fill="#000" font-weight="400"'));
      });

      axisElements.push(svgText("Combined Score", margin.left + chartW / 2, axisHeight - 10, 'text-anchor="middle" font-family="MontserratCustom" font-size="15" fill="#000" font-weight="400"'));
      axisSvg.setAttribute("viewBox", `0 0 ${width} ${axisHeight}`);
      axisSvg.innerHTML = `<g>${axisElements.join("")}</g>`;
    }

    function setActiveButton(view) {
      const dotsBtn = document.getElementById("dots-btn");
      const barsBtn = document.getElementById("bars-btn");

      dotsBtn.classList.toggle("active", view === "dots");
      barsBtn.classList.toggle("active", view === "bars");
    }

    function switchView(view) {
      const title = document.getElementById("title");
      const dotsView = document.getElementById("dots-view");
      const barsView = document.getElementById("bars-view");

      if (view === "bars") {
        title.textContent = "COMBINED INDEX";
        title.style.fontSize = "34px";
        dotsView.style.display = "none";
        barsView.style.display = "block";
        renderBars(currentPoints);
      } else {
        title.textContent = "ETHICAL COMPLIANCE INDEX";
        title.style.fontSize = "52px";
        dotsView.style.display = "block";
        barsView.style.display = "none";
        renderScatter(currentPoints);
      }

      currentView = view;
      setActiveButton(view);
    }

    async function loadData() {
      const [controlResponse, colorResponse] = await Promise.all([
        fetch(controlFile),
        fetch(colorFile)
      ]);

      if (!controlResponse.ok || !colorResponse.ok) {
        throw new Error("Could not load one or both Excel files from the Data folder.");
      }

      const [controlBuffer, colorBuffer] = await Promise.all([
        controlResponse.arrayBuffer(),
        colorResponse.arrayBuffer()
      ]);

      const controlRows = getFirstSheetRows(readWorkbookFromBuffer(controlBuffer));
      const colorRows = getFirstSheetRows(readWorkbookFromBuffer(colorBuffer));

      const controlData = parseControlRows(controlRows);
      const colorMap = parseColorRows(colorRows);

      return controlData.map((item) => ({
        ...item,
        color: colorMap.get(normalizeBrand(item.brand)) || "#000000"
      }));
    }

    let currentPoints = [];
    let currentView = "dots";

    async function init() {
      try {
        currentPoints = await loadData();
        renderLegend(currentPoints);
        renderIntroChart();
        createIntroTokens();

        const dotsBtn = document.getElementById("dots-btn");
        const barsBtn = document.getElementById("bars-btn");
        const skipButton = document.getElementById("intro-skip");
        dotsBtn.addEventListener("click", () => switchView("dots"));
        barsBtn.addEventListener("click", () => switchView("bars"));
        skipButton.addEventListener("click", () => showMainInterface());
      } catch (error) {
        console.error(error);
      }
    }

    window.addEventListener("resize", () => {
      const introView = document.getElementById("intro-view");
      if (introView && introView.style.display !== "none") {
        renderIntroChart();
        if (introState.revealed) {
          revealIntroCorrectPlacements(true);
        } else {
          placeIntroTokensInTray();
        }
      }

      if (currentPoints.length > 0) {
        if (currentView === "dots") {
          renderScatter(currentPoints);
        } else {
          renderBars(currentPoints);
        }
      }
    });

    init();
  </script>
</body>
</html>
