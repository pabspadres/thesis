<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ethical Compliance Index Prototype</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    @font-face {
      font-family: "InterCustom";
      src: url("./Fonts/Inter/static/Inter_24pt-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }

    @font-face {
      font-family: "MontserratCustom";
      src: url("./Fonts/Montserrat/static/Montserrat-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }

    :root {
      color: #000;
      background: #fff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      color: #000;
      overflow: hidden;
    }

    body {
      position: relative;
      font-family: "MontserratCustom", sans-serif;
    }

    #title {
      position: absolute;
      top: 20px;
      left: 40px;
      margin: 0;
      color: #000;
      font-family: "InterCustom", sans-serif;
      font-weight: 700;
      font-size: 34px;
      line-height: 1;
      white-space: nowrap;
      z-index: 20;
    }

    #view-toggle {
      position: absolute;
      top: 20px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 20;
    }

    .view-button {
      min-width: 94px;
      height: 38px;
      border: 2px solid #000;
      background: #fff;
      color: #000;
      cursor: pointer;
      font-family: "MontserratCustom", sans-serif;
      font-size: 16px;
      font-weight: 400;
      line-height: 1;
    }

    .view-button.active {
      background: #000;
      color: #fff;
    }

    #dots-view,
    #bars-view {
      position: absolute;
      top: 66px;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: calc(100% - 66px);
      font-family: "MontserratCustom", sans-serif;
      color: #000;
    }

    #bars-view {
      display: none;
    }

    #main {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      width: 100%;
      height: 100%;
    }

    #legend-panel {
      width: 30%;
      min-width: 220px;
      height: 100%;
      overflow-y: auto;
      padding: 18px 16px 16px 40px;
      font-size: 14px;
      scrollbar-width: none;
    }

    #legend-panel::-webkit-scrollbar {
      display: none;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 8px 0;
      line-height: 1.2;
      color: #000;
      font-family: "MontserratCustom", sans-serif;
      font-weight: 400;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    #chart-panel {
      width: 70%;
      height: 100%;
      padding: 10px 18px 18px 8px;
    }

    #chart {
      width: 100%;
      height: 100%;
      display: block;
      background: #fff;
    }

    .scatter-dot {
      transition: transform 0.2s ease;
      transform-origin: center;
      transform-box: fill-box;
    }

    .scatter-dot.is-hovered {
      transform: scale(1.2);
    }

    #bars-layout {
      width: 100%;
      height: 100%;
      padding: 10px;
    }

    #bars-scroll {
      width: 100%;
      height: calc(100% - 74px);
      overflow-y: auto;
      overflow-x: hidden;
    }

    #bars-chart {
      width: 100%;
      display: block;
      background: #fff;
    }

    #bars-axis-wrap {
      width: 100%;
      height: 74px;
      background: #fff;
      overflow: hidden;
    }

    #bars-axis {
      width: 100%;
      height: 100%;
      display: block;
      background: #fff;
    }

  </style>
</head>
<body>
  <h1 id="title">ETHICAL COMPLIANCE INDEX</h1>

  <div id="view-toggle">
    <button id="dots-btn" class="view-button active" type="button">Dots</button>
    <button id="bars-btn" class="view-button" type="button">Bars</button>
  </div>

  <section id="dots-view" aria-label="Dots View">
    <div id="main">
      <div id="legend-panel" aria-label="Legend"></div>
      <div id="chart-panel">
        <svg id="chart" role="img" aria-label="Scatter plot of Ethical Compliance Score vs Revenue Scale Score"></svg>
      </div>
    </div>
  </section>

  <section id="bars-view" aria-label="Bars View">
    <div id="bars-layout">
      <div id="bars-scroll">
        <svg id="bars-chart" role="img" aria-label="Scrollable horizontal bars by brand"></svg>
      </div>
      <div id="bars-axis-wrap">
        <svg id="bars-axis" role="img" aria-label="Combined Score x-axis"></svg>
      </div>
    </div>
  </section>

  <script>
    const controlFile = "./Data/Control_Database.xlsx";
    const colorFile = "./Data/Color_Database.xlsx";
    const scatterTicks = [0, 25, 50, 75, 100];
    const barsTicks = [0, 50, 100, 150, 200];

    function normalizeBrand(value) {
      return String(value || "").trim().toLowerCase();
    }

    function readWorkbookFromBuffer(buffer) {
      return XLSX.read(buffer, { type: "array" });
    }

    function getFirstSheetRows(workbook) {
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      return XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: null, raw: true });
    }

    function findHeaderRow(rows, requiredHeaders) {
      const required = requiredHeaders.map((h) => h.toLowerCase());
      return rows.findIndex((row) => {
        const rowHeaders = row
          .map((cell) => (typeof cell === "string" ? cell.trim().toLowerCase() : ""))
          .filter(Boolean);
        return required.every((requiredHeader) => rowHeaders.includes(requiredHeader));
      });
    }

    function parseControlRows(rows) {
      const headerRowIndex = findHeaderRow(rows, ["Brand", "Ethical Compliance Score", "Scale Score (Revenue)", "Final Score"]);
      if (headerRowIndex === -1) {
        throw new Error("Control_Database.xlsx header row not found.");
      }

      const headers = rows[headerRowIndex].map((v) => (typeof v === "string" ? v.trim() : v));
      const brandIdx = headers.findIndex((h) => String(h).toLowerCase() === "brand");
      const ethicalIdx = headers.findIndex((h) => String(h).toLowerCase() === "ethical compliance score");
      const scaleIdx = headers.findIndex((h) => String(h).toLowerCase() === "scale score (revenue)");
      const finalIdx = headers.findIndex((h) => String(h).toLowerCase() === "final score");

      const output = [];
      for (let i = headerRowIndex + 1; i < rows.length; i += 1) {
        const row = rows[i];
        if (!row || row.length === 0) {
          continue;
        }

        const brand = row[brandIdx];
        const ethicalScore = Number(row[ethicalIdx]);
        const scaleScore = Number(row[scaleIdx]);
        const finalScore = Number(row[finalIdx]);

        if (!brand || Number.isNaN(ethicalScore) || Number.isNaN(scaleScore) || Number.isNaN(finalScore)) {
          continue;
        }

        output.push({
          brand: String(brand).trim(),
          ethical: Math.max(0, Math.min(100, ethicalScore)),
          scale: Math.max(0, Math.min(100, scaleScore)),
          final: Math.max(0, Math.min(200, finalScore))
        });
      }
      return output;
    }

    function parseColorRows(rows) {
      const headerRowIndex = findHeaderRow(rows, ["Brand", "Color"]);
      if (headerRowIndex === -1) {
        throw new Error("Color_Database.xlsx header row not found.");
      }

      const headers = rows[headerRowIndex].map((v) => (typeof v === "string" ? v.trim() : v));
      const brandIdx = headers.findIndex((h) => String(h).toLowerCase() === "brand");
      const colorIdx = headers.findIndex((h) => String(h).toLowerCase() === "color");

      const colorMap = new Map();
      for (let i = headerRowIndex + 1; i < rows.length; i += 1) {
        const row = rows[i];
        if (!row || row.length === 0) {
          continue;
        }

        const brand = row[brandIdx];
        const color = row[colorIdx];

        if (!brand || !color) {
          continue;
        }

        colorMap.set(normalizeBrand(brand), String(color).trim());
      }
      return colorMap;
    }

    function svgText(content, x, y, extraAttrs = "") {
      return `<text x="${x}" y="${y}" ${extraAttrs}>${content}</text>`;
    }

    function escapeXml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&apos;");
    }

    function renderLegend(points) {
      const legendPanel = document.getElementById("legend-panel");
      legendPanel.innerHTML = "";

      points.forEach((point) => {
        const item = document.createElement("div");
        item.className = "legend-item";

        const dot = document.createElement("span");
        dot.className = "legend-dot";
        dot.style.backgroundColor = point.color;

        const label = document.createElement("span");
        label.textContent = point.brand;

        item.appendChild(dot);
        item.appendChild(label);
        legendPanel.appendChild(item);
      });
    }

    function renderScatter(points) {
      const svg = document.getElementById("chart");
      const width = Math.max(640, svg.clientWidth);
      const height = Math.max(420, svg.clientHeight);

      const margin = { top: 24, right: 30, bottom: 72, left: 86 };
      const chartW = width - margin.left - margin.right;
      const chartH = height - margin.top - margin.bottom;

      const xToPx = (value) => margin.left + (value / 100) * chartW;
      const yToPx = (value) => margin.top + chartH - (value / 100) * chartH;

      const axisAndTicks = [];
      axisAndTicks.push(`<line x1="${margin.left}" y1="${margin.top + chartH}" x2="${margin.left + chartW}" y2="${margin.top + chartH}" stroke="#000" stroke-width="1.5" />`);
      axisAndTicks.push(`<line x1="${margin.left}" y1="${margin.top + chartH}" x2="${margin.left}" y2="${margin.top}" stroke="#000" stroke-width="1.5" />`);

      scatterTicks.forEach((tick) => {
        const x = xToPx(tick);
        const y = yToPx(tick);

        axisAndTicks.push(`<line x1="${x}" y1="${margin.top + chartH}" x2="${x}" y2="${margin.top + chartH + 6}" stroke="#000" stroke-width="1" />`);
        axisAndTicks.push(svgText(tick, x, margin.top + chartH + 24, 'text-anchor="middle" font-family="MontserratCustom" font-size="13" fill="#000" font-weight="400"'));

        axisAndTicks.push(`<line x1="${margin.left - 6}" y1="${y}" x2="${margin.left}" y2="${y}" stroke="#000" stroke-width="1" />`);
        axisAndTicks.push(svgText(tick, margin.left - 12, y + 4, 'text-anchor="end" font-family="MontserratCustom" font-size="13" fill="#000" font-weight="400"'));
      });

      axisAndTicks.push(svgText("Ethical Compliance Score", margin.left + chartW / 2, height - 22, 'text-anchor="middle" font-family="MontserratCustom" font-size="15" fill="#000" font-weight="400"'));
      axisAndTicks.push(`<text x="24" y="${margin.top + chartH / 2}" transform="rotate(-90 24 ${margin.top + chartH / 2})" text-anchor="middle" font-family="MontserratCustom" font-size="15" fill="#000" font-weight="400">Revenue Scale Score</text>`);

      const dots = points
        .map((point) => {
          const cx = xToPx(point.ethical);
          const cy = yToPx(point.scale);
          return `<circle class="scatter-dot" data-brand="${escapeXml(point.brand)}" cx="${cx}" cy="${cy}" r="8" fill="${point.color}" />`;
        })
        .join("");

      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.innerHTML = `<g>${axisAndTicks.join("")}${dots}</g>
      <g id="tooltip" visibility="hidden" pointer-events="none">
        <rect id="tooltip-bg" x="0" y="0" width="0" height="0" rx="4" ry="4" fill="rgba(0,0,0,0.6)"></rect>
        <text id="tooltip-text" x="0" y="0" fill="#fff" font-family="MontserratCustom" font-size="13" font-weight="400"></text>
      </g>`;

      const tooltipGroup = svg.querySelector("#tooltip");
      const tooltipBg = svg.querySelector("#tooltip-bg");
      const tooltipText = svg.querySelector("#tooltip-text");
      const dotElements = svg.querySelectorAll(".scatter-dot");

      dotElements.forEach((dot) => {
        dot.addEventListener("mouseenter", (event) => {
          dot.classList.add("is-hovered");
          const brand = dot.getAttribute("data-brand") || "";
          tooltipText.textContent = brand;

          const textBox = tooltipText.getBBox();
          const paddingX = 8;
          const paddingY = 6;
          const boxWidth = textBox.width + paddingX * 2;
          const boxHeight = textBox.height + paddingY * 2;

          const cx = Number(dot.getAttribute("cx"));
          const cy = Number(dot.getAttribute("cy"));
          let boxX = cx + 12;
          let boxY = cy - boxHeight - 12;

          if (boxX + boxWidth > width - 4) {
            boxX = cx - boxWidth - 12;
          }
          if (boxY < 4) {
            boxY = cy + 12;
          }

          tooltipBg.setAttribute("x", String(boxX));
          tooltipBg.setAttribute("y", String(boxY));
          tooltipBg.setAttribute("width", String(boxWidth));
          tooltipBg.setAttribute("height", String(boxHeight));

          tooltipText.setAttribute("x", String(boxX + paddingX));
          tooltipText.setAttribute("y", String(boxY + boxHeight - paddingY - 1));

          tooltipGroup.setAttribute("visibility", "visible");
        });

        dot.addEventListener("mouseleave", () => {
          dot.classList.remove("is-hovered");
          tooltipGroup.setAttribute("visibility", "hidden");
        });
      });
    }

    function renderBars(points) {
      const svg = document.getElementById("bars-chart");
      const axisSvg = document.getElementById("bars-axis");
      const scroll = document.getElementById("bars-scroll");
      const width = Math.max(900, scroll.clientWidth);

      const barHeight = 22;
      const rowGap = 12;
      const totalRowsHeight = points.length * (barHeight + rowGap);
      const margin = { top: 16, right: 36, bottom: 12, left: 190 };
      const height = margin.top + totalRowsHeight + margin.bottom;
      const chartW = width - margin.left - margin.right;

      const xToPx = (value) => margin.left + (value / 200) * chartW;

      const elements = [];
      elements.push(`<line x1="${margin.left}" y1="${margin.top}" x2="${margin.left}" y2="${height - margin.bottom}" stroke="#000" stroke-width="1.5" />`);

      points.forEach((point, index) => {
        const y = margin.top + index * (barHeight + rowGap);
        const barEnd = xToPx(point.final);
        elements.push(`<rect x="${margin.left}" y="${y}" width="${Math.max(0, barEnd - margin.left)}" height="${barHeight}" fill="${point.color}" />`);
        elements.push(svgText(escapeXml(point.brand), margin.left - 10, y + barHeight - 6, 'text-anchor="end" font-family="MontserratCustom" font-size="13" fill="#000" font-weight="400"'));
      });

      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("height", String(height));
      svg.innerHTML = `<g>${elements.join("")}</g>`;

      const axisHeight = 74;
      const axisY = 16;
      const axisElements = [];
      axisElements.push(`<line x1="${margin.left}" y1="${axisY}" x2="${margin.left + chartW}" y2="${axisY}" stroke="#000" stroke-width="1.5" />`);
      axisElements.push(`<line x1="${margin.left}" y1="4" x2="${margin.left}" y2="${axisY}" stroke="#000" stroke-width="1.5" />`);

      barsTicks.forEach((tick) => {
        const x = xToPx(tick);
        axisElements.push(`<line x1="${x}" y1="${axisY}" x2="${x}" y2="${axisY + 6}" stroke="#000" stroke-width="1" />`);
        axisElements.push(svgText(tick, x, axisY + 24, 'text-anchor="middle" font-family="MontserratCustom" font-size="13" fill="#000" font-weight="400"'));
      });

      axisElements.push(svgText("Combined Score", margin.left + chartW / 2, axisHeight - 10, 'text-anchor="middle" font-family="MontserratCustom" font-size="15" fill="#000" font-weight="400"'));
      axisSvg.setAttribute("viewBox", `0 0 ${width} ${axisHeight}`);
      axisSvg.innerHTML = `<g>${axisElements.join("")}</g>`;
    }

    function setActiveButton(view) {
      const dotsBtn = document.getElementById("dots-btn");
      const barsBtn = document.getElementById("bars-btn");

      dotsBtn.classList.toggle("active", view === "dots");
      barsBtn.classList.toggle("active", view === "bars");
    }

    function switchView(view) {
      const title = document.getElementById("title");
      const dotsView = document.getElementById("dots-view");
      const barsView = document.getElementById("bars-view");

      if (view === "bars") {
        title.textContent = "COMBINED INDEX";
        dotsView.style.display = "none";
        barsView.style.display = "block";
        renderBars(currentPoints);
      } else {
        title.textContent = "ETHICAL COMPLIANCE INDEX";
        dotsView.style.display = "block";
        barsView.style.display = "none";
        renderScatter(currentPoints);
      }

      currentView = view;
      setActiveButton(view);
    }

    async function loadData() {
      const [controlResponse, colorResponse] = await Promise.all([
        fetch(controlFile),
        fetch(colorFile)
      ]);

      if (!controlResponse.ok || !colorResponse.ok) {
        throw new Error("Could not load one or both Excel files from the Data folder.");
      }

      const [controlBuffer, colorBuffer] = await Promise.all([
        controlResponse.arrayBuffer(),
        colorResponse.arrayBuffer()
      ]);

      const controlRows = getFirstSheetRows(readWorkbookFromBuffer(controlBuffer));
      const colorRows = getFirstSheetRows(readWorkbookFromBuffer(colorBuffer));

      const controlData = parseControlRows(controlRows);
      const colorMap = parseColorRows(colorRows);

      return controlData.map((item) => ({
        ...item,
        color: colorMap.get(normalizeBrand(item.brand)) || "#000000"
      }));
    }

    let currentPoints = [];
    let currentView = "dots";

    async function init() {
      try {
        currentPoints = await loadData();
        renderLegend(currentPoints);
        switchView("dots");

        const dotsBtn = document.getElementById("dots-btn");
        const barsBtn = document.getElementById("bars-btn");
        dotsBtn.addEventListener("click", () => switchView("dots"));
        barsBtn.addEventListener("click", () => switchView("bars"));
      } catch (error) {
        console.error(error);
      }
    }

    window.addEventListener("resize", () => {
      if (currentPoints.length > 0) {
        if (currentView === "dots") {
          renderScatter(currentPoints);
        } else {
          renderBars(currentPoints);
        }
      }
    });

    init();
  </script>
</body>
</html>
